[project]
name = "assignment-llamea"
version = "0.1.0"
description = "LLaMEA-generated Bayesian optimization experiments"
readme = "README.md"
authors = [
    { name = "Dario Ackermann", email = "darioack@gmail.com" },
    { name = "Ewelina Kowalczyk", email = "ewelinaenia@gmial.com" },
    { name = "Brasso Kattenberg", email = "brasso.kattenberg@gmail.com" },
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "botorch==0.18.1",
    "cma==4.5.0",
    "google-genai==1.75.0",
    "gpytorch==1.15.2",
    "ioh==0.3.22",
    "llamea==1.4.2",
    "matplotlib==3.11.2",
    "notebook>=7.6.3",
    "numpy==2.5.4",
    "openai==1.109.1",
    "practical-problems",
    "python-dotenv>=1.2.4",
    "scipy==1.18.1",
    "torch==2.15.0+cpu",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
practical-problems = { git = "https://github.com/BayesOptApp/Practical_Problems.git", rev = "124998b6adbfa1f0fe775b0d5e6ee7141ff72d6d" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
